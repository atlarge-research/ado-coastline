#
# Minimum-GPU example: the algorithm of autoconf's min_gpu_recommender. It keeps the
# job's total batch_size and returns the first GPU count in 1, 2, 4, ... that is
# feasible with the batch split evenly, reported with Kavier predicted throughput
# and power.
#
# Run from the root of the ado repository:
#   uv run run_experiment plugins/custom_experiments/coastline/examples/min_gpu.yaml
entity:
  model_name: granite-3-8b
  method: lora
  gpu_model: NVIDIA-A100-SXM4-80GB
  tokens_per_sample: 2048
  batch_size: 16
  max_gpus: 8
experiments:
  - actuatorIdentifier: custom_experiments
    experimentIdentifier: coastline_min_gpu_recommender
    experimentVersion: 1.0.0
