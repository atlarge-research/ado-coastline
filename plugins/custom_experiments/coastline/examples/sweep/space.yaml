#
# Sweep COASTLINE recommendations over a configuration space. Each point yields a
# recommended GPU layout (gpus/workers/total_gpus) plus predicted throughput, power
# and tokens-per-watt.
#
# The optional inputs not swept here keep their defaults: max_gpus 8,
# gpus_per_node 8, feasibility "autoconf", feasibility_model "" (use model_name).
#
# Create it from the root of the ado repository:
#   uv run ado create space -f plugins/custom_experiments/coastline/examples/sweep/space.yaml
sampleStoreIdentifier: default
entitySpace:
  - identifier: model_name
    propertyDomain:
      values:
        - "granite-3-8b"
        - "granite-3.1-8b-instruct"
        - "granite-3.3-8b"
        - "mistral-7b-v0.1"
  - identifier: method
    propertyDomain:
      values: ["full", "lora"]
  - identifier: gpu_model
    propertyDomain:
      values: ["NVIDIA-A100-80GB-PCIe", "NVIDIA-A100-SXM4-80GB"]
  # The experiment declares tokens_per_sample and batch_size as continuous; the
  # sweep pins them to the discrete values of interest. batch_size is per device.
  - identifier: tokens_per_sample
    propertyDomain:
      values: [1024, 2048, 4096]
  - identifier: batch_size
    propertyDomain:
      values: [8, 16, 32]
  # preset is an optional property of coastline_recommender. Sweeping it compares
  # the multi-objective policies over the same AutoConf-feasible layouts.
  - identifier: preset
    propertyDomain:
      values: ["balanced", "energy", "performance"]
experiments:
  - actuatorIdentifier: custom_experiments
    experimentIdentifier: coastline_recommender
    experimentVersion: 1.0.0
metadata:
  name: coastline_recommendation_sweep
  description: "COASTLINE layouts under each multi-objective preset"
